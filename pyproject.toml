[project]
name = "microsaas-research"
version = "0.1.0"
description = "Micro-SaaS trend research — Claude skill orchestrated"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.scripts]
prr = "microsaas_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microsaas_research"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
